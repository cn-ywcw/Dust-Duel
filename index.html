<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>尘埃对决</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            overflow: hidden;
            font-family: 'Microsoft YaHei', sans-serif;
        }
        canvas {
            display: block;
        }
        #startScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.85);
            z-index: 10;
            cursor: pointer;
            transition: opacity 0.5s;
        }
        #startScreen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #startScreen h1 {
            font-size: 64px;
            color: #e8d5b7;
            letter-spacing: 8px;
            margin-bottom: 20px;
            text-shadow: 0 0 40px rgba(200, 170, 120, 0.6);
        }
        #startScreen p {
            font-size: 20px;
            color: #8b7355;
            letter-spacing: 4px;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="startScreen" onclick="if(window.startGame) window.startGame()">
        <h1>尘埃对决</h1>
        <p>点击任意位置开始</p>
    </div>
    <script src="game.js"></script>
</body>
</html>
